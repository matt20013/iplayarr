name: PR Build Check

on:
    pull_request:
        branches:
            - '**'
    push:
        branches:
            - native-search-series-expansion-ci-tests

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 23
                  cache: 'npm'

            - name: Install Dependencies
              run: npm run install:both

            - name: Run build
              run: npm run build:both
