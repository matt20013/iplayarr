name: Publish Fork to GHCR

on:
  push:
    branches:
      - 'fix/native-search-series-expansion-build'
  workflow_dispatch:

jobs:
  push_to_registry:
    name: Push Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and Sanitize Branch Name
        id: extract_tag
        run: |
          # Keep the original name with the slash for the internal version file
          echo "git_tag=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          
          # Replace the '/' with a '-' to create a valid Docker tag
          SAFE_TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "docker_tag=$SAFE_TAG" >> $GITHUB_ENV

      - name: Write version to JSON
        run: |
          mkdir -p src/config
          echo "{\"version\": \"${{ env.git_tag }}\"}" > src/config/version.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Optimized for your Synology NAS (Intel Celeron)
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/iplayarr:${{ env.docker_tag }}
          build-args: |
            iplayarr_version=${{ env.git_tag }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/iplayarr
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true